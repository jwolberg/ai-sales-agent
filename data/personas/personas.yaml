# Synthetic prospect personas (PRD §12.2). Designed to reveal weaknesses, not flatter the
# agent. Each persona carries ground-truth `facts` (their real situation — the prospect answers
# consistently from these, and scoring can check what the agent actually extracted), behavior
# `traits`, the `objections` they'll raise (natural language the agent's detector should catch),
# and outcome flags (`converts` if handled well; `disqualifies` if the agent should NOT force a
# close). Field keys in `facts` match the discovery/profile field keys.

personas:
  - key: motivated_parent
    name: Motivated Parent
    summary: Clear need, high urgency, moderate price sensitivity; converts if trust is built.
    converts: true
    disqualifies: false
    traits:
      - Engaged and forthcoming, but still answers one thing at a time (don't dump everything).
      - Wants to move quickly once it feels like a good fit.
    facts:
      relationship_to_student: parent
      student_name: Diego
      subject: Algebra II
      grade_level: 10th grade
      challenge: fell behind after a tough unit and is losing confidence
      goal: get back on track before finals
      urgency: within the next week
      schedule_constraints: weekday evenings
      decision_maker_status: primary decision maker
    objections: []

  - key: skeptical_parent
    name: Skeptical Parent
    summary: Tried tutoring before; doubts it will work; pushes for proof and guarantees.
    converts: true
    disqualifies: false
    traits:
      - Guarded; needs the agent to acknowledge past disappointment before engaging.
      - Pushes for proof; do NOT accept vague reassurance.
    facts:
      relationship_to_student: parent
      student_name: Maya
      subject: SAT reading and writing
      grade_level: 11th grade
      challenge: scores plateaued despite a previous tutor
      goal: a meaningful score bump for college applications
      urgency: a few months before the next test date
      schedule_constraints: weekends
      decision_maker_status: shares the decision with a spouse
    objections:
      - We tried tutoring before and it didn't really work.
      - How do I know the tutor will actually be good?

  - key: price_sensitive_parent
    name: Price-Sensitive Parent
    summary: Interested but cost-focused; compares cheaper options; may ask for a discount.
    converts: true
    disqualifies: false
    traits:
      - Circles back to cost; needs value reframed around outcomes, not the cheapest option.
      - Mentions a cheaper local tutor as leverage.
    facts:
      relationship_to_student: parent
      student_name: Aiden
      subject: Geometry
      grade_level: 9th grade
      challenge: struggling with proofs and slipping grades
      goal: bring the grade up to a B before the semester ends
      urgency: this month
      schedule_constraints: flexible, prefers afternoons
      decision_maker_status: primary decision maker
    objections:
      - Honestly this sounds too expensive.
      - Can we get a discount?
      - There's a local tutor who charges way less.

  - key: busy_parent
    name: Busy Parent
    summary: Limited time, wants fast answers, low patience for long discovery.
    converts: true
    disqualifies: false
    traits:
      - Terse; gives short answers and signals time pressure.
      - Rewards an agent that gets to the point; penalizes drawn-out discovery.
    facts:
      relationship_to_student: parent
      student_name: Priya
      subject: Chemistry
      grade_level: 11th grade
      challenge: needs help keeping up with weekly coursework
      goal: steady weekly support so grades stop slipping
      urgency: wants to start basically now
      schedule_constraints: only has a few minutes; evenings work
      decision_maker_status: primary decision maker
    objections:
      - I don't have a lot of time, can you just tell me how it works?

  - key: competitive_shopper
    name: Competitive Shopper
    summary: Comparing us to alternatives; asks direct competitive questions.
    converts: true
    disqualifies: false
    traits:
      - Analytical; asks how it stacks up against named competitors.
      - Wants concrete differentiation, not platitudes.
    facts:
      relationship_to_student: parent
      student_name: Jordan
      subject: ACT prep
      grade_level: 11th grade
      challenge: wants a structured prep plan
      goal: a strong ACT score with an efficient plan
      urgency: over the next two months
      schedule_constraints: weekday evenings
      decision_maker_status: primary decision maker
    objections:
      - We're also looking at Wyzant and a local center — why you over them?
      - How is this different from what the school already offers?

  - key: poor_fit
    name: Poor Fit / Disqualified Lead
    summary: Unclear need, unrealistic expectations, not ready — tests whether the agent forces a close.
    converts: false
    disqualifies: true
    traits:
      - Vague and noncommittal; can't articulate a concrete need.
      - Has unrealistic expectations (e.g. a guaranteed perfect score in a week) and isn't ready to commit.
      - The agent should qualify gently and NOT push a close; reward graceful handling.
    facts:
      relationship_to_student: parent
      subject: not sure, maybe everything
      grade_level: unsure
      goal: wants a guaranteed perfect score basically overnight
      urgency: just browsing, not really ready
      decision_maker_status: noncommittal
    objections:
      - I'm really just looking around for now.
      - Can you guarantee straight A's?

  # --- Intent-router benchmark personas (IR5-T1) ---------------------------------------------
  # Each carries a ground-truth `target_leaf`; `opening_line` is how they start the call (some
  # explicit, some deliberately vague so the agent must disambiguate). The benchmark scores the
  # agent's reached leaf against `target_leaf`.
  - key: router_sat_explicit
    name: SAT Parent (explicit)
    summary: Knows exactly what they want — SAT prep for a junior.
    converts: true
    disqualifies: false
    target_leaf: test_prep/SAT
    opening_line: Hi, I'm looking to get my daughter ready for the SAT.
    traits:
      - Direct and clear about the need.
    facts:
      relationship_to_student: parent
      goal: SAT prep before the fall test

  - key: router_act_ambiguous
    name: College-Exam Parent (ambiguous)
    summary: Wants college-entrance-exam prep but doesn't name the test until asked; it's the ACT.
    converts: true
    disqualifies: false
    target_leaf: test_prep/ACT
    opening_line: We need to start getting ready for college entrance exams.
    traits:
      - Opens vaguely ("entrance exams"); only says it's the ACT when the agent asks which test.

  - key: router_psat
    name: PSAT Parent
    summary: Sophomore has the PSAT coming up.
    converts: true
    disqualifies: false
    target_leaf: test_prep/PSAT
    opening_line: My son has the PSAT in a couple of months and wants to be ready.
    traits:
      - Clear it's the PSAT specifically.

  - key: router_algebra_ambiguous
    name: Struggling-Student Parent (ambiguous)
    summary: Says the student is "struggling in school"; the real need is algebra tutoring.
    converts: true
    disqualifies: false
    target_leaf: tutoring/math/algebra
    opening_line: My son is really struggling in school and I don't know where to start.
    traits:
      - Vague at first; when asked, it's a math class — specifically algebra.

  - key: router_geometry
    name: Geometry Parent
    summary: Needs geometry help for a 10th grader.
    converts: true
    disqualifies: false
    target_leaf: tutoring/math/geometry
    opening_line: He's having a hard time with geometry this semester.
    traits:
      - Names geometry directly.

  - key: router_chemistry
    name: Chemistry Parent
    summary: Wants a chemistry tutor.
    converts: true
    disqualifies: false
    target_leaf: tutoring/science/chemistry
    opening_line: I think we need a chemistry tutor for my daughter.
    traits:
      - Names chemistry directly.

  - key: router_biology
    name: Biology Student
    summary: A student calling about biology help.
    converts: true
    disqualifies: false
    target_leaf: tutoring/science/biology
    opening_line: I'm having trouble keeping up in biology.
    traits:
      - The student themselves; names biology.

  - key: router_physics
    name: Physics Parent
    summary: Looking for physics tutoring.
    converts: true
    disqualifies: false
    target_leaf: tutoring/science/physics
    opening_line: Do you have anyone who can help with physics?
    traits:
      - Names physics directly.

  - key: router_science_ambiguous
    name: Science Parent (ambiguous)
    summary: Says "science help"; the real need is chemistry.
    converts: true
    disqualifies: false
    target_leaf: tutoring/science/chemistry
    opening_line: We could use some help with science.
    traits:
      - Opens with "science"; when asked which one, it's chemistry.

  - key: router_tutoring_vague
    name: Vague Tutoring Caller
    summary: Just asks whether tutoring is offered; the real need is geometry.
    converts: true
    disqualifies: false
    target_leaf: tutoring/math/geometry
    opening_line: Hi — do you all offer tutoring?
    traits:
      - Very vague; reveals it's a math subject, then geometry, only when asked.
