# Objection-handling playbook (PRD Use Case 4; §8 price-rebuttal baseline).
#
# Each objection has detection `cues` (matched as lowercase substrings), a `high_risk`
# flag (high-risk objections are escalation candidates per DE-4 / §18), an approved
# baseline `rebuttal`, and an optional `kb_query` to ground supporting detail from the KB.
#
# The `price` objection is the documented BASELINE for the Phase 7 recursive-improvement
# loop. All rebuttal text here is PLACEHOLDER — replace with Nerdy-approved language
# (see docs/QandA_opens.md). Rebuttals avoid inventing prices, discounts, or guarantees.

objections:
  - key: discount
    high_risk: true
    cues: ["discount", "coupon", "promo code", "lower the price", "cheaper rate", "deal"]
    rebuttal: >-
      I hear you on wanting the best value. I'm not able to set or change pricing myself,
      but I can connect you with a specialist who can walk through the options and anything
      currently available. First, let's make sure we land on the right kind of support.

  - key: price
    baseline: true
    high_risk: false
    cues: ["too expensive", "expensive", "cost too much", "can't afford", "pricey", "out of budget"]
    kb_query: "pricing plans cost"
    rebuttal: >-
      Totally fair — cost matters, especially before you know exactly what your child needs.
      Can I ask: are you mainly trying to keep it affordable, or to make sure that if you do
      invest it actually works? That helps me point you to the right fit, not the priciest one.

  - key: spouse
    high_risk: false
    cues: ["talk to my spouse", "talk to my husband", "talk to my wife", "talk to my partner", "run it by", "check with my"]
    rebuttal: >-
      That makes complete sense — this is a family decision. I can put together a short
      summary of what we discussed so it's easy to share, and answer anything they'd want to
      know. What questions do you think they'll have?

  - key: comparison
    high_risk: false
    cues: ["wyzant", "local tutor", "school support", "comparing", "shopping around", "other options"]
    kb_query: "tutor matching formats"
    rebuttal: >-
      Smart to compare. What tends to set us apart is matching your child to a tutor around
      their specific goals, level, and learning style, with sessions tailored to where they're
      actually stuck. What matters most to you as you weigh the options?

  - key: tutor_quality
    high_risk: false
    cues: ["how do i know the tutor", "tutor will be good", "qualified", "good tutor", "vetted"]
    kb_query: "tutor matching quality"
    rebuttal: >-
      Great question — fit is everything. We match based on subject, goals, and learning style,
      and a student can be re-matched if it isn't clicking. I can have a specialist confirm the
      specifics of how tutors are vetted.

  - key: tried_before
    high_risk: false
    cues: ["tried tutoring before", "didn't work", "did not work", "tried a tutor", "no results"]
    rebuttal: >-
      I appreciate you sharing that — it's frustrating to invest and not see results. It often
      comes down to fit and focus. If we can pinpoint exactly where your child is getting stuck,
      support gets a lot more targeted. What do you think the last experience missed?
