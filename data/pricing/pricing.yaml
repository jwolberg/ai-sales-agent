# Intent-router price table — keyed by taxonomy LEAF id (IR1-T1, R6).
#
# !!! PLACEHOLDER PRICING — NOT approved business figures. !!!
# These exist so the classify -> quote flow is demoable end-to-end. Replace with approved
# operator-provided numbers before any real use. `approved: false` flags this; the agent may
# still quote them in dev, but the value is the authoritative source the mis-quote guardrail
# (IR1-T2) checks against — the agent may NEVER state a price that isn't in this table.
#
# Prices are looked up EXACTLY by leaf id (never fuzzy/retrieved). A leaf with no entry here
# yields an honest fallback (R6b), not an invented number.

currency: USD
approved: false

