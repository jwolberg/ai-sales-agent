[project]
name = "nerdy-sales-agent"
version = "0.1.0"
description = "Autonomous AI Sales Agent backend (Nerdy / Varsity Tutors)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "tomli>=2.0; python_version < '3.11'",  # TOML config parsing (stdlib tomllib is 3.11+)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]
# Realtime voice stack (Pipecat: Deepgram STT + Claude + Cartesia TTS). Heavy and
# native-build-prone; installed separately from the core dev setup. See docs/RUNBOOK.md.
# Upper bound pins to the 0.0.x line: the current context/aggregator API we use is
# deprecated and slated for removal in a future (0.1+) release. See implementation-notes.
voice = [
    "pipecat-ai[anthropic,deepgram,cartesia,webrtc,silero]>=0.0.108,<0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
