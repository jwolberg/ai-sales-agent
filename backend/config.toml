# Non-secret, tunable runtime settings (committed to git).
# Secrets (API keys) live in backend/.env, which is gitignored.
# An environment variable of the same name still overrides any value here.
# NOTE: this file overrides the defaults in app/config.py — set values HERE.

# --- Agent persona ---
agent_name = "Jay"
company_name = "Nerdy"

# --- Debug ---
# Logs inbound audio / VAD / transcription to the server console. Flip on while debugging.
voice_debug = false

# --- LLM ---
# Use "claude-haiku-4-5" for lower latency.
anthropic_model = "claude-sonnet-4-6"

