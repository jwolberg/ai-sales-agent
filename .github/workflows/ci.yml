# CI: lint, format, and test the Python backend; verify the committed dashboard build is current.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install
        run: pip install -r requirements/dev.txt && pip install --no-deps -e .
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests (core; voice tests skip without the voice extra)
        run: pytest -q

  backend-voice:
    # The voice extra (Pipecat) is heavy and native-build-prone, so it runs in its own job.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: System libs for the voice extra
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1
      - name: Install
        run: pip install -r requirements/dev-voice.txt && pip install --no-deps -e .
      - name: Voice tests
        run: pytest -q tests/test_bot.py tests/test_voice_pipeline.py tests/test_vad_replay.py

  dashboard:
    # dist/ is committed so /dashboard serves without a build step — fail if it's stale.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/dashboard-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/dashboard-app/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: dist/ matches source
        run: git diff --exit-code -- dist
